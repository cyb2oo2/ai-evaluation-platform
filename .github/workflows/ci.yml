name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Validate protocol examples
        run: python tools/validate_examples.py
      - name: Run and verify deterministic evidence smoke
        run: python tools/run_ci_smoke.py
      - name: Upload verified evidence smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: evidence-smoke
          path: runs/ci-smoke
          if-no-files-found: error
          retention-days: 7
